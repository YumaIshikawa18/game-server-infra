name: terraform-cd

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions: {}

# terraform-destroy と同じグループにして、prod への同時実行を防ぐ
concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_VERSION: 1.17.0
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: envs/prod

jobs:
  plan:
    name: plan (prod)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
          role-session-name: terraform-cd-plan-${{ github.run_id }}

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform -chdir="$TF_WORKING_DIR" init -backend-config="bucket=$TF_STATE_BUCKET"

      # 終了コード 0: 差分なし / 1: エラー / 2: 差分あり
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir="$TF_WORKING_DIR" plan -lock=false -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          case "$code" in
            0) echo "has_changes=false" >>"$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true" >>"$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
          {
            echo '### Terraform plan (prod)'
            echo '```hcl'
            terraform -chdir="$TF_WORKING_DIR" show -no-color tfplan | head -c 60000
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload plan
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-prod
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: apply (prod)
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Environment "prod" に Required reviewers を設定して承認必須にする
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
          role-session-name: terraform-cd-apply-${{ github.run_id }}

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform -chdir="$TF_WORKING_DIR" init -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Download plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-prod
          path: ${{ env.TF_WORKING_DIR }}

      # 承認待ちの間に state が変わっていれば、保存した plan は stale として拒否される
      - name: terraform apply
        run: terraform -chdir="$TF_WORKING_DIR" apply -no-color tfplan

      - name: Show outputs
        run: |
          {
            echo '### Outputs'
            echo '```'
            terraform -chdir="$TF_WORKING_DIR" output -no-color
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
