name: terraform-cd

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions: {}

# terraform-destroy と同じグループにして、prod への同時実行を防ぐ
concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: envs/prod
  # アカウント ID は個人情報として扱う。値は Secrets から渡し、ログ・PR コメント・Job summary に出さない
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_allowed_account_ids: '["${{ secrets.AWS_ACCOUNT_ID }}"]'

jobs:
  plan:
    name: plan (prod)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Terraform のバージョンは mise.toml で管理する
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
          mask-aws-account-id: true
          role-session-name: terraform-cd-plan-${{ github.run_id }}

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform -chdir="$TF_WORKING_DIR" init -backend-config="bucket=$TF_STATE_BUCKET"

      # 終了コード 0: 差分なし / 1: エラー / 2: 差分あり
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform -chdir="$TF_WORKING_DIR" plan -lock=false -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          case "$code" in
            0) echo "has_changes=false" >>"$GITHUB_OUTPUT" ;;
            2) echo "has_changes=true" >>"$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac
          {
            echo '### Terraform plan (prod)'
            echo '```hcl'
            terraform -chdir="$TF_WORKING_DIR" show -no-color tfplan | sed "s/$AWS_ACCOUNT_ID/************/g" | head -c 60000
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  apply:
    name: apply (prod)
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Environment "prod" に Required reviewers を設定して承認必須にする
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Terraform のバージョンは mise.toml で管理する
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
          mask-aws-account-id: true
          role-session-name: terraform-cd-apply-${{ github.run_id }}

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: terraform -chdir="$TF_WORKING_DIR" init -backend-config="bucket=$TF_STATE_BUCKET"

      # plan ファイルには state が丸ごと入るため、public リポジトリでは artifact で受け渡さない。
      # 承認後にこのジョブで plan を作り直して適用する（同時実行は concurrency で防いでいる）
      - name: terraform apply
        run: |
          terraform -chdir="$TF_WORKING_DIR" plan -no-color -out=tfplan >/dev/null
          terraform -chdir="$TF_WORKING_DIR" apply -no-color tfplan

      - name: Show outputs
        run: |
          {
            echo '### Outputs'
            echo '```'
            terraform -chdir="$TF_WORKING_DIR" output -no-color | sed "s/$AWS_ACCOUNT_ID/************/g"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
