name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
  TF_INPUTS_JSON: ${{ secrets.TF_INPUTS_JSON }}
  MC_LOCK_BUCKET: ${{ secrets.MC_LOCK_BUCKET }}
  MC_LOCK_KEY: ${{ secrets.MC_LOCK_KEY }}
  MC_EVENTS_TOPIC_ARN: ${{ secrets.MC_EVENTS_TOPIC_ARN }}
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'

jobs:
  plan:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_PLAN_ROLE_ARN }}
    outputs:
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned Terraform version
        id: tools
        run: |
          version=$(awk '$1 == "terraform" { print $2 }' .tool-versions)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "terraform=$version" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tools.outputs.terraform }}
          terraform_wrapper: false
      - name: Mask identifiers
        run: python3 -m scripts.cd.deploy mask
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 3600
      - name: Prepare the plan for approval
        id: plan
        run: python3 -m scripts.cd.deploy prepare

  apply:
    needs: plan
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: prod
    concurrency:
      group: minecraft-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_APPLY_ROLE_ARN }}
      EXPECTED_PLAN_DIGEST: ${{ needs.plan.outputs.plan_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned Terraform version
        id: tools
        run: |
          version=$(awk '$1 == "terraform" { print $2 }' .tool-versions)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "terraform=$version" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tools.outputs.terraform }}
          terraform_wrapper: false
      - name: Mask identifiers
        run: python3 -m scripts.cd.deploy mask
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        id: auth
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 3600
      - name: Compare the approved plan, protect data, apply and smoke test
        run: python3 -m scripts.cd.deploy apply
      - name: Notify deployment failure
        if: ${{ failure() && steps.auth.outcome == 'success' }}
        run: python3 -m scripts.cd.deploy notify-failure
