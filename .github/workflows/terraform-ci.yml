name: terraform-ci

on:
  pull_request:
    branches: [master]

permissions: {}

concurrency:
  group: terraform-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: envs/prod

jobs:
  static-checks:
    name: fmt / validate / tflint / trivy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ツールのバージョンは mise.toml で管理する（terraform / tflint / trivy）
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        run: |
          for dir in bootstrap "$TF_WORKING_DIR"; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      # mock_provider を使うため AWS の認証情報は不要
      - name: terraform test
        run: |
          terraform -chdir="$TF_WORKING_DIR" test
          for dir in modules/*/; do
            [ -d "$dir/tests" ] || continue
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: trivy (IaC misconfiguration)
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 .

  plan:
    name: plan (prod)
    needs: static-checks
    # フォークからの PR には OIDC トークンが発行されないため実行しない
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ツールのバージョンは mise.toml で管理する
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install_args: terraform

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
          role-session-name: terraform-ci-pr-${{ github.event.pull_request.number }}

      - name: terraform init
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform -chdir="$TF_WORKING_DIR" init -backend-config="bucket=$TF_STATE_BUCKET"

      # plan ロールは state への書き込み権限を持たないため、ロックは取らない
      - name: terraform plan
        id: plan
        continue-on-error: true
        run: |
          set -o pipefail
          terraform -chdir="$TF_WORKING_DIR" plan -lock=false -no-color -out=tfplan 2>&1 | tee plan.log
          terraform -chdir="$TF_WORKING_DIR" show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- terraform-plan:prod -->';
            const ok = process.env.PLAN_OUTCOME === 'success';
            const raw = fs.readFileSync(ok ? 'plan.txt' : 'plan.log', 'utf8');
            const limit = 60000;
            const text = raw.length > limit ? `${raw.slice(0, limit)}\n... (truncated, see the workflow log)` : raw;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `### Terraform plan (prod): ${ok ? '✅ success' : '❌ failed'}`,
              `commit: ${context.payload.pull_request.head.sha.slice(0, 7)} / [workflow run](${runUrl})`,
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              text,
              '```',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome != 'success'
        run: exit 1
